<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cutline</title>
  <link rel="stylesheet" href="/src/vendor/lucide/lucide.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "htm": "https://esm.sh/htm@3.1.1",
      "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/+esm",
      "mp4box": "https://cdn.jsdelivr.net/npm/mp4box@0.5.2/+esm"
    }
  }
  </script>
  <style>
    :root {
      --bg: #111214; --panel: #1a1c20; --panel2: #22252b; --line: #2e3138; --text: #e8e9ec;
      --muted: #8b8f98; --accent: #22d3c5; --accent-ink: #062b28; --danger: #ef5b5b;
      --clip: #2f5d8a; --text-seg: #7a4fb5; --caption: #a8721f;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; user-select: none; }
    button, .button {
      background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 10px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; text-align: center;
    }
    button:hover { border-color: #444a55; }
    button:disabled { opacity: .5; cursor: default; }
    .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .danger { color: var(--danger); }
    .wide { width: 100%; margin-top: 8px; }
    input, select, textarea { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 5px 7px; }
    input[type=range] { padding: 0; accent-color: var(--accent); width: 100%; }
    input[type=color] { padding: 0; height: 28px; width: 100%; }
    textarea { width: 100%; resize: vertical; user-select: text; }
    h3 { margin: 4px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .muted { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .between { justify-content: space-between; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chip.on { border-color: var(--accent); color: var(--accent); }

    .app { display: grid; grid-template-rows: 48px 1fr 300px; height: 100%; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .brand { font-weight: 900; font-size: 16px; letter-spacing: .02em; }
    main { display: grid; grid-template-columns: 240px 1fr 290px; min-height: 0; }
    .panel { background: var(--panel); padding: 12px; overflow: auto; min-height: 0; }
    .media { border-right: 1px solid var(--line); }
    .inspector { border-left: 1px solid var(--line); }
    .drop { border: 1px dashed var(--line); border-radius: 6px; padding: 10px; text-align: center; color: var(--muted); margin: 8px 0; font-size: 12px; }
    .drop.on { border-color: var(--accent); color: var(--accent); }
    .media-list { display: grid; gap: 6px; margin-bottom: 14px; }
    .media-item { display: grid; grid-template-columns: 56px 1fr; grid-template-rows: auto auto; gap: 0 8px; padding: 4px; border-radius: 6px; cursor: pointer; }
    .media-item:hover { background: var(--panel2); }
    .media-item img, .media-item video { grid-row: span 2; width: 56px; height: 36px; object-fit: cover; border-radius: 4px; background: #000; }
    .media-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-item small { color: var(--muted); }

    .player { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
    .stage { display: grid; place-items: center; padding: 12px; min-height: 0; overflow: hidden; }
    .stage canvas { max-width: 100%; max-height: 100%; background: #000; box-shadow: 0 0 0 1px var(--line); }
    .transport { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); }
    .transport .play { width: 44px; }
    .tc { font-variant-numeric: tabular-nums; }
    .hint { margin-left: auto; color: var(--muted); font-size: 12px; }

    .field { display: grid; gap: 4px; margin: 8px 0; }
    .field > span { color: var(--muted); font-size: 12px; }
    .anim-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .timeline { display: grid; grid-template-rows: auto 1fr; border-top: 1px solid var(--line); background: var(--panel); min-height: 0; }
    .tl-toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    .tl-toolbar input[type=range] { width: 140px; }
    .spacer { flex: 1; }
    .tl-scroll { overflow: auto; position: relative; }
    .tl-inner { position: relative; min-height: 100%; }
    .ruler { height: 24px; position: relative; border-bottom: 1px solid var(--line); cursor: text; }
    .tick { position: absolute; top: 4px; font-size: 10px; color: var(--muted); padding-left: 3px; border-left: 1px solid var(--line); height: 20px; }
    .track { position: relative; height: 64px; border-bottom: 1px solid var(--line); }
    .main-track { height: 80px; }
    .track-label { position: absolute; left: 0; top: 0; bottom: 0; width: 70px; display: grid; place-items: center; color: var(--muted); font-size: 11px; background: var(--panel); z-index: 2; border-right: 1px solid var(--line); }
    .seg { position: absolute; top: 8px; bottom: 8px; border-radius: 6px; overflow: hidden; display: flex; align-items: center; padding: 0 12px; cursor: grab; font-size: 12px; white-space: nowrap; border: 2px solid transparent; }
    .seg span { overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .seg.clip { background: var(--clip); }
    .seg.text { background: var(--text-seg); }
    .seg.caption { background: var(--caption); }
    .seg.selected { border-color: #fff; }
    .handle { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; background: rgba(255,255,255,.12); }
    .handle.l { left: 0; } .handle.r { right: 0; }
    .diamond { position: absolute; top: 28px; transform: translateX(-50%); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--line); cursor: pointer; z-index: 3; font-size: 10px; color: var(--muted); }
    .diamond.has { color: var(--accent); border-color: var(--accent); }
    .diamond.selected { background: var(--accent); color: var(--accent-ink); }
    .empty { position: absolute; left: 90px; top: 30px; color: var(--muted); }
    .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; z-index: 4; }
    .playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--accent); }

    /* left panel tabs */
    .left { border-right: 1px solid var(--line); }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
    .tab { padding: 6px 4px; font-size: 12px; }
    .tab.on { border-color: var(--accent); color: var(--accent); }
    .preset { padding: 10px 6px; font-size: 14px; }
    .tr-tile { display: grid; gap: 6px; justify-items: center; padding: 8px 4px; font-size: 12px; }
    .tr-icon { width: 54px; height: 32px; border-radius: 4px; position: relative; overflow: hidden;
      background: linear-gradient(90deg, #2f5d8a 50%, #a8721f 50%); background-size: 200% 100%; animation: tr-slide 1.6s infinite; }
    .tr-crossfade, .tr-dissolve { background: #2f5d8a; animation: tr-fade 1.6s infinite; }
    .tr-fadeBlack, .tr-flash { animation: tr-dip 1.6s infinite; background: #2f5d8a; }
    .tr-flash { --dip: #fff; }
    .tr-wipeDown, .tr-pushUp { background: linear-gradient(180deg, #a8721f 50%, #2f5d8a 50%); background-size: 100% 200%; animation: tr-vert 1.6s infinite; }
    .tr-circle { background: radial-gradient(circle, #a8721f 40%, #2f5d8a 41%); background-size: 100% 100%; animation: tr-zoom 1.6s infinite; }
    .tr-zoom, .tr-spin, .tr-pixelate, .tr-glitch { background: #2f5d8a; animation: tr-fade 1.6s infinite, tr-pulse 1.6s infinite; }
    .tr-spin { animation: tr-fade 1.6s infinite, tr-rot 1.6s infinite; }
    @keyframes tr-slide { 0%, 30% { background-position: 100% 0; } 70%, 100% { background-position: 0 0; } }
    @keyframes tr-vert { 0%, 30% { background-position: 0 100%; } 70%, 100% { background-position: 0 0; } }
    @keyframes tr-fade { 0%, 30% { background-color: #2f5d8a; } 70%, 100% { background-color: #a8721f; } }
    @keyframes tr-dip { 0%, 100% { background: #2f5d8a; } 50% { background: var(--dip, #000); } }
    @keyframes tr-zoom { 0%, 20% { background-size: 10% 10%; background-position: center; } 80%, 100% { background-size: 400% 400%; background-position: center; } }
    @keyframes tr-pulse { 50% { transform: scale(.8); } }
    @keyframes tr-rot { 50% { transform: rotate(180deg) scale(.6); } }

    /* preview transform overlay */
    .stage { position: relative; }
    .overlay { position: absolute; cursor: default; touch-action: none; }
    .tbox { position: absolute; border: 1.5px solid var(--accent); box-shadow: 0 0 0 1px rgba(0,0,0,.4); cursor: move; pointer-events: none; }
    .tbox.text { border-style: dashed; }
    .knob { position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid var(--accent); border-radius: 50%; pointer-events: auto; }
    .knob.nw { left: -7px; top: -7px; cursor: nwse-resize; } .knob.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
    .knob.ne { right: -7px; top: -7px; cursor: nesw-resize; } .knob.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .rot { position: absolute; left: 50%; top: -30px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); pointer-events: auto; cursor: grab; }
    .rot::after { content: ""; position: absolute; left: 6px; top: 14px; width: 2px; height: 16px; background: var(--accent); }
    .guide { position: absolute; background: #ff3b8d; pointer-events: none; }
    .guide.v { left: 50%; top: 0; bottom: 0; width: 1px; }
    .guide.h { top: 50%; left: 0; right: 0; height: 1px; }

    /* speed */
    .speed-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
    .speed-chips .chip { padding: 5px 0; }
    .speed-badge { margin-left: 8px; background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 4px; font-size: 11px; pointer-events: none; }

    /* timeline extras */
    .sep { width: 1px; height: 20px; background: var(--line); }
    .marquee { position: absolute; border: 1px solid var(--accent); background: rgba(34, 211, 197, .12); pointer-events: none; z-index: 5; }
    .toast { position: fixed; bottom: 316px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line);
      padding: 8px 14px; border-radius: 8px; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
    table.keys { width: 100%; border-collapse: collapse; }
    table.keys td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
    kbd { background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; font: 12px/1.6 Inter, sans-serif; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 10; }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(440px, 92vw); }
    .status { color: var(--accent); }
    .error { color: var(--danger); }
    .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .bar div { height: 100%; background: var(--accent); }
    .result { width: 100%; margin-top: 8px; border-radius: 6px; background: #000; }
    /* ---- 1.1: tracks, inspector tabs, keyframes, catalogues ---- */
    .app { grid-template-rows: 48px auto 1fr 300px; }
    .tabs { grid-template-columns: repeat(3, 1fr); }
    .text-track { height: 52px; }
    .main-track { height: 72px; }
    .lane-overlay { height: 52px; }
    .lane-audio { height: 48px; }
    .lane-effect { height: 34px; }
    .lane-effect .seg { top: 5px; bottom: 5px; font-size: 11px; }
    .lane-audio .seg { top: 4px; bottom: 4px; }
    .seg.overlay { background: #4b6b2f; }
    .seg.audio { background: #1f5c58; }
    .seg.effect { background: #7a3d6b; }
    .seg.muted { opacity: .55; }
    .seg .wave { position: absolute; left: 0; top: 4px; width: 100%; height: calc(100% - 8px); pointer-events: none; }
    .seg .badge { margin-left: 6px; font-size: 11px; opacity: .85; pointer-events: none; }
    .kmark { position: absolute; bottom: 2px; width: 8px; height: 8px; background: #ffd400; transform: rotate(45deg); border: 1px solid #0006; pointer-events: none; }
    .snapline { position: absolute; top: 24px; bottom: 0; width: 1px; background: #ffd400; pointer-events: none; z-index: 4; }
    .tl-resize { height: 5px; margin-top: -3px; cursor: ns-resize; position: relative; z-index: 6; }
    .tl-resize:hover { background: var(--accent); }
    .timeline { grid-template-rows: auto auto 1fr; }

    .itabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 8px 0; }
    .itabs .tab { font-size: 11px; padding: 5px 2px; }
    .section { border-top: 1px solid var(--line); margin-top: 8px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 4px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
    .section-body { padding-bottom: 4px; }
    .kfield { margin: 8px 0; }
    .kfield-head { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .kfield-head b, .field b { color: var(--text); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .kbtns { display: flex; gap: 2px; }
    button.mini { padding: 1px 6px; font-size: 11px; line-height: 16px; }
    button.kf { padding: 0 6px; font-size: 11px; line-height: 18px; color: var(--muted); background: transparent; }
    button.kf.has { color: #ffd400; }
    button.kf.on { color: #111; background: #ffd400; border-color: #ffd400; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
    .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; cursor: pointer; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chips .chip { padding: 3px 7px; font-size: 11px; }
    .filter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 6px 0; }
    .filter-grid .chip { padding: 5px 2px; font-size: 11px; }
    .fx-row { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
    .curve-svg { width: 100%; background: var(--panel2); border-radius: 6px; touch-action: none; }
    .curve-box { fill: none; stroke: var(--line); }
    .curve-line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .curve-arm { stroke: #ffd40099; stroke-width: 1; }
    .curve-knob { fill: #ffd400; cursor: grab; }
    .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.wrap { flex-wrap: wrap; }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    .card { padding: 4px; display: grid; gap: 4px; font-size: 11px; text-align: center; }
    .card .thumb { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 4px; background: #000; }
    .card:hover { border-color: var(--accent); }

    .media-item small { display: flex; gap: 6px; align-items: center; }
    .media-item .add { padding: 0 5px; font-size: 10px; line-height: 15px; opacity: 0; }
    .media-item:hover .add { opacity: 1; }
    .media-item.missing { opacity: .5; cursor: default; }
    .audio-thumb { grid-row: span 2; width: 56px; height: 36px; border-radius: 4px; background: #1f5c58; display: grid; place-items: center; font-size: 18px; }

    .menu { position: relative; }
    .menu-list { position: absolute; top: 34px; left: 0; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 4px; min-width: 230px; display: grid; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .menu-list button { text-align: left; border: 0; background: transparent; display: flex; justify-content: space-between; }
    .menu-list button:hover { background: var(--panel2); }
    .menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
    .relink { display: flex; gap: 10px; align-items: center; padding: 6px 12px; background: #3b2a0a; border-bottom: 1px solid #6b4b12; }
    .relink span { flex: 1; }
    .tl-scroll.tool-razor .seg, .tl-scroll.tool-razor .seg * { cursor: crosshair; }
    .tl-scroll.tool-hand, .tl-scroll.tool-hand * { cursor: grab; }
    .tl-scroll.panning, .tl-scroll.panning * { cursor: grabbing !important; }
    .axis { position: absolute; inset: 0; pointer-events: none; }
    .axis i { position: absolute; background: rgba(255,255,255,.35); }
    .axis i.v { top: 0; bottom: 0; width: 1px; }
    .axis i.h { left: 0; right: 0; height: 1px; }
    .axis i.c { background: rgba(34,211,197,.8); }
    .axis b { position: absolute; border: 1px dashed rgba(255,255,255,.3); inset: 5%; }
    .linkbar { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--panel2); border: 1px solid var(--line);
      border-radius: 6px; padding: 2px 8px; margin: 4px 0 6px; }
    .linkbar .check { margin: 4px 0; font-size: 12px; }
    .multitext .itabs { grid-template-columns: repeat(2, 1fr); }
    .multitext { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0 10px; }
    .insert-line { position: absolute; top: 24px; bottom: 0; width: 3px; margin-left: -1px; background: #ffd400; box-shadow: 0 0 8px #ffd400; z-index: 6; pointer-events: none; }
    .drag-ghost { position: absolute; z-index: 7; pointer-events: none; border-radius: 6px; border: 2px solid #fff; background: rgba(47,93,138,.85);
      display: flex; align-items: center; padding: 0 10px; font-size: 12px; white-space: nowrap; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    .drag-ghost.overlay { background: rgba(75,107,47,.9); }
    .drag-ghost.drop { background: #ffd400; border: 0; padding: 0; box-shadow: 0 0 8px #ffd400; }
    .media-item.active { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--accent); }
    .media-item[draggable=true] { cursor: grab; }
    .source { display: grid; grid-template-rows: auto 1fr auto auto auto; height: 100%; min-height: 0; }
    .source-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
    .source-head b { flex: 1; min-width: 0; }
    .source-tag { background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; }
    .source-stage { display: grid; place-items: center; min-height: 0; padding: 10px; overflow: hidden; background: #000; }
    .source-stage video, .source-stage img { max-width: 100%; max-height: 100%; }
    .source-audio { font-size: 64px; color: var(--accent); }
    .source-bar { position: relative; height: 18px; margin: 6px 12px 0; background: var(--panel2); border-radius: 4px; cursor: pointer; }
    .source-range { position: absolute; top: 0; bottom: 0; background: rgba(34,211,197,.35); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .source-head-pos { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #fff; }
    .source-add { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
    .player.previewing { grid-template-rows: 1fr; }
    .player.previewing > .stage, .player.previewing > .transport { display: none; }
    .seg .label { position: relative; z-index: 1; background: rgba(0,0,0,.55); padding: 1px 6px; border-radius: 4px; }
    .seg .speed-badge, .seg .badge, .seg .kmark, .seg .handle { z-index: 2; }
    .seg .badge { position: relative; background: rgba(0,0,0,.5); padding: 0 4px; border-radius: 4px; }
    .stage-hint { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; padding: 24px;
      color: var(--muted); pointer-events: none; max-width: 520px; margin: auto; }
    .stage-hint b { color: var(--text); font-size: 15px; }
    .stage-hint.error b { color: #ffb4a8; }
    .source-stage { position: relative; }
    .media-item .warn { color: #ffb4a8; font-weight: 600; font-size: 10px; }
    .stage canvas { max-width: none; max-height: none; }
    .stage { display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; min-width: 0; overflow: hidden; }
    .player { grid-template-rows: minmax(0, 1fr) auto; }
    main { min-height: 0; }
    .track-label { transform: translateX(var(--sx, 0px)); z-index: 6; box-shadow: 4px 0 8px rgba(0,0,0,.35); }
    .playhead { z-index: 5; }
    .itabs.two { grid-template-columns: 1fr 1fr; }
    .speedcurve .chips .chip { font-size: 11px; }
    .sc-grid { stroke: var(--line); stroke-width: 1; }
    .sc-one { stroke: #ffffff55; stroke-width: 1; stroke-dasharray: 3 3; }
    .sc-label { fill: var(--muted); font-size: 9px; text-anchor: end; }
    .sc-play { stroke: var(--accent); stroke-width: 1.5; }
    .smoothbox { margin: 6px 0 10px; }
    .transport .pq { margin-left: 8px; padding: 3px 6px; font-size: 12px; }
    /* ===================== 1.8 layout: CapCut-style workspace ===================== */
    :root { --bg: #0f0f10; --panel: #1c1c1e; --panel2: #29292c; --line: #2e2e32; --text: #e8e8ea; --muted: #8d8d93;
      --accent: #1fc9dd; --accent-ink: #00282d; --clip: #1a6375; }
    body { background: var(--bg); font-size: 12px; }
    .ico { font-size: 15px; line-height: 1; vertical-align: -2px; }
    button { border-radius: 5px; }
    .app { gap: 4px; padding: 0 4px 4px; }
    main { grid-template-columns: minmax(320px, 27%) minmax(0, 1fr) minmax(330px, 28%); gap: 4px; }
    .panel { border-radius: 8px; border: 0 !important; }
    .timeline { border-radius: 8px; border: 0; }

    /* top bar */
    header.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--bg); border: 0; padding: 0 4px; }
    .topbar .row { gap: 10px; }
    .topbar > .row:last-child { justify-content: flex-end; }
    .topbar .title { text-align: center; font-weight: 600; max-width: 40vw; }
    .brand { font-size: 14px; display: flex; gap: 6px; align-items: center; }
    .menu-btn { background: var(--panel2); border: 0; padding: 4px 10px; display: flex; gap: 4px; align-items: center; }
    .menu-list kbd { margin-left: 16px; font-size: 10px; }
    .savestat { color: var(--muted); display: flex; gap: 5px; align-items: center; white-space: nowrap; }
    .savestat .ico { color: #3fcf8e; }
    .savestat.dim { opacity: .7; }
    .export-btn { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; padding: 5px 14px; display: flex; gap: 6px; align-items: center; }
    .ibtn { background: transparent; border: 0; padding: 4px 6px; color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
    .ibtn:hover:not(:disabled) { background: var(--panel2); }
    .ibtn.on { color: var(--accent); }
    .ibtn:disabled { opacity: .35; }

    /* left: icon tabs + sub-menu + content */
    .panel.left { padding: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .libtabs { display: flex; gap: 0; padding: 6px 4px 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; position: relative; }
    .libtabs::-webkit-scrollbar { display: none; }
    .libtabs button { background: transparent; border: 0; display: grid; justify-items: center; gap: 4px; padding: 4px 7px; min-width: 52px; color: var(--text); font-size: 11px; }
    .libtabs button.on { color: var(--accent); }
    .libtabs .libmore { min-width: 22px; position: sticky; right: 0; background: var(--panel); color: var(--muted); }
    .libbody { display: grid; grid-template-columns: 112px minmax(0, 1fr); min-height: 0; }
    .subnav { border-right: 1px solid var(--line); padding: 8px 6px; display: grid; align-content: start; gap: 4px; overflow: auto; }
    .subnav button { background: transparent; border: 0; text-align: left; padding: 7px 8px; color: var(--text); font-size: 12px; }
    .subnav button.on { background: var(--panel2); color: var(--accent); }
    .libcontent { padding: 10px; overflow: auto; min-height: 0; }
    .lib-title { display: block; margin: 2px 0 8px; font-size: 13px; }
    .import-btn { width: 100%; background: var(--panel2); border: 1px solid var(--line); padding: 9px; display: flex; gap: 6px; justify-content: center; align-items: center; font-weight: 600; }
    .drop-hint { display: grid; justify-items: center; gap: 8px; color: var(--muted); padding: 40px 10px; text-align: center; }
    .media-drop { min-height: 100%; }
    .media-drop.on { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 6px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px 8px; margin-top: 10px; }
    .mcard { cursor: pointer; min-width: 0; }
    .mcard[draggable=true] { cursor: grab; }
    .mthumb { position: relative; aspect-ratio: 16 / 10; background: #000; border-radius: 6px; overflow: hidden; border: 2px solid transparent; }
    .mcard.active .mthumb, .mcard:hover .mthumb { border-color: var(--accent); }
    .mthumb img, .mthumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mthumb .audio-thumb { width: 100%; height: 100%; display: grid; place-items: center; background: #1d4a48; color: #9ff; border-radius: 0; }
    .mdur { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.65); padding: 0 4px; border-radius: 3px; font-size: 10px; }
    .mwarn { position: absolute; left: 4px; bottom: 4px; color: #ffb4a8; }
    .madd, .mlayer { position: absolute; top: 4px; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 0; display: grid; place-items: center; opacity: 0; }
    .madd { right: 4px; background: var(--accent); color: var(--accent-ink); }
    .mlayer { right: 30px; background: #3a3a3d; color: var(--text); }
    .mcard:hover .madd, .mcard:hover .mlayer { opacity: 1; }
    .mname { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .mcard.missing { opacity: .45; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .tile { aspect-ratio: 1.25; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
    .tile:hover { border-color: var(--accent); }
    .card-big { width: 100%; padding: 18px; background: var(--panel2); border: 1px solid var(--line); display: flex; gap: 8px; justify-content: center; align-items: center; font-weight: 600; }

    /* player */
    .panel.player { padding: 0; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
    .phead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-weight: 600; }
    .player > .transport { display: grid; grid-template-columns: 1fr auto 1fr; border-top: 0; padding: 6px 12px; }
    .tc { font-variant-numeric: tabular-nums; }
    .tc b { color: var(--accent); font-weight: 500; }
    .tc span { color: var(--muted); margin-left: 6px; }
    .tcenter { display: flex; gap: 4px; align-items: center; }
    .ibtn.play { width: 34px; height: 30px; }
    .tright { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
    .transport .pq { background: transparent; border: 1px solid var(--line); font-size: 11px; padding: 2px 4px; margin: 0; }
    .player.previewing { grid-template-rows: minmax(0, 1fr); }
    .player.previewing > .phead { display: none; }
    .stage:fullscreen { background: #000; }

    /* inspector */
    .panel.inspector { padding: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .itop { display: flex; gap: 2px; align-items: center; padding: 4px 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
    .itop button { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 9px; color: var(--text); font-weight: 600; white-space: nowrap; }
    .itop button.on { color: var(--accent); border-bottom-color: var(--accent); }
    .itop-note { margin-left: auto; color: var(--muted); font-size: 11px; max-width: 35%; }
    .ibody { overflow: auto; padding: 10px 12px; min-height: 0; }
    .seg-ctl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border-radius: 6px; padding: 3px; margin-bottom: 8px; }
    .seg-ctl button { background: transparent; border: 0; color: var(--muted); padding: 6px; border-radius: 4px; }
    .seg-ctl button.on { background: var(--panel2); color: var(--text); }
    .section { border-top: 1px solid var(--line); }
    .ibody > .section:first-child, .seg-ctl + .section { border-top: 0; }
    .section-head { color: var(--text); font-size: 12px; padding: 10px 0 6px; }
    .section-head .caret { font-size: 12px; color: var(--muted); margin-left: 3px; }
    .krow { display: grid; grid-template-columns: 70px minmax(0, 1fr) 66px 52px; gap: 8px; align-items: center; margin: 9px 0; }
    .krow.pos { grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1fr) 52px; }
    .klabel { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kslider { width: 100%; }
    .knum, .xy { display: flex; align-items: center; background: var(--panel2); border-radius: 5px; padding-right: 6px; min-width: 0; }
    .knum input, .xy input { width: 100%; min-width: 0; background: transparent; border: 0; padding: 4px 4px 4px 6px; text-align: right; }
    .knum em { font-style: normal; color: var(--muted); font-size: 11px; }
    .xy { padding-left: 8px; padding-right: 0; }
    .xy b { color: var(--muted); font-weight: 500; font-size: 11px; }
    .kkf { display: flex; justify-content: flex-end; align-items: center; }
    .kkf .kn { background: transparent; border: 0; padding: 0 2px; color: var(--muted); width: 14px; display: inline-block; }
    .kkf .kf { background: transparent; border: 0; color: var(--muted); padding: 0 3px; font-size: 15px; }
    .kkf .kf.has { color: #ffd400; }
    .kkf .kf.on { color: #ffd400; text-shadow: 0 0 6px #ffd40099; }
    .kwide { grid-column: 2 / 5; }
    .align-row { display: flex; gap: 2px; background: var(--panel2); border-radius: 6px; padding: 2px; width: max-content; margin: 8px 0 6px; }
    .action-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; border-top: 1px solid var(--line); padding-top: 10px; }
    .action-row button { display: flex; gap: 5px; align-items: center; }
    .linkbar { margin: 0 0 8px; }

    /* timeline */
    .tl-toolbar { gap: 2px; padding: 4px 8px; }
    .tl-toolbar .tgroup { display: flex; gap: 1px; background: var(--bg); border-radius: 6px; padding: 2px; }
    .tl-toolbar .ibtn { font-size: 15px; padding: 4px 7px; }
    .tl-toolbar .sep { margin: 0 4px; }
    .tl-toolbar .zoom { width: 110px; }
    .track-label { width: 150px; display: flex; flex-direction: row; justify-content: space-between; align-items: center; gap: 4px; padding: 0 6px 0 10px; place-items: unset; }
    .th-name { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; }
    .th-btns { display: flex; gap: 0; }
    .th-btns button { background: transparent; border: 0; padding: 2px 3px; color: var(--muted); }
    .th-btns button:hover { color: var(--text); }
    .th-btns button.on { color: var(--accent); }
    .track.hidden > .seg, .track.hidden > .diamond { opacity: .3; }
    .track.locked > .seg { cursor: not-allowed; filter: saturate(.35) brightness(.85); }
    .track.locked > .seg .handle { pointer-events: none; }
    .seg.clip { background: var(--clip); }
    .ruler { background: var(--panel); }
    .empty { left: 170px; }
    /* trim handles: wide grab zones with a bracket, like most editors */
    .seg .handle { width: 12px; cursor: ew-resize; background: transparent; z-index: 3; }
    .seg .handle::after { content: ""; position: absolute; top: 3px; bottom: 3px; width: 4px; border-radius: 2px; background: #fff; opacity: 0; transition: opacity .12s; }
    .seg .handle.l::after { left: 2px; } .seg .handle.r::after { right: 2px; }
    .seg:hover .handle::after { opacity: .55; }
    .seg.selected .handle::after, .seg .handle:hover::after { opacity: 1; }
    .seg .handle:hover { background: rgba(255,255,255,.12); }
    .main-track .diamond { top: 2px; width: 18px; height: 18px; font-size: 9px; z-index: 4; }
    .trimtip { position: fixed; z-index: 50; pointer-events: none; background: #000d; color: #fff; border: 1px solid var(--accent);
      border-radius: 5px; padding: 3px 8px; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* text presets */
    .save-preset { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 0 0 8px; }
    .preset-name { display: flex; gap: 6px; margin: 0 0 8px; }
    .preset-name input { flex: 1; min-width: 0; }
    .ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .ptile { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; }
    .ptile.def { border-color: #ffd400; }
    .ptile:hover { border-color: var(--accent); }
    .ptile-main { background: #111; border: 0; border-radius: 0; height: 70px; padding: 6px; display: grid; place-items: center; overflow: hidden; }
    .ptile-sample { font-size: 18px; line-height: 1.1; padding: 2px 6px; border-radius: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ptile-name { padding: 5px 8px 0; font-size: 12px; }
    input.ptile-name { margin: 4px 6px 0; padding: 2px 6px; }
    .ptile-btns { display: flex; gap: 0; padding: 2px 4px 4px; }
    .ptile-btns button { background: transparent; border: 0; padding: 3px 5px; color: var(--muted); }
    .ptile-btns button:hover { color: var(--text); }
    .ptile-btns button.on { color: #ffd400; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Export needs WebCodecs (VideoEncoder + AudioEncoder) and previews need WebGL2.
    // Chrome, Edge and other Chromium browsers have both; warn elsewhere instead of failing later.
    (function () {
      var gl2 = !!document.createElement("canvas").getContext("webgl2");
      if (window.VideoEncoder && window.AudioEncoder && gl2) return;
      var bar = document.createElement("div");
      bar.setAttribute("role", "alert");
      bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;padding:10px 44px 10px 16px;background:#7a2e0e;color:#fff;font:14px/1.4 system-ui,sans-serif";
      bar.innerHTML = "<b>This browser can't export video.</b> Cutline needs <b>Google Chrome</b> or <b>Microsoft Edge</b> (free). Editing may work here, but exporting MP4 won't. " +
        '<button aria-label="Dismiss" style="position:absolute;right:10px;top:6px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer">×</button>';
      bar.querySelector("button").onclick = function () { bar.remove(); };
      document.body.appendChild(bar);
    })();
  </script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
